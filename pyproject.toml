[project]
name = "ds-skiller"
version = "0.2.0"
description = "Token-friendly, visual-first Senior Data Scientist AI skills for Claude Code, Codex and Gemini/Antigravity."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "shap>=0.46",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "pillow>=10.0",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds_core"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains models (classification/regression/tune/pipeline)"]
